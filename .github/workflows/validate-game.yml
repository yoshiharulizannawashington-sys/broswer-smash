name: Validate Browser Smash

on:
  push:
    paths:
      - "public/js/**/*.js"
      - "public/models/characters/manifest.json"
      - "public/index.html"
      - "index.html"
      - ".github/workflows/validate-game.yml"
      - ".github/workflows/build-character-animations.yml"
      - "scripts/browser-smoke.mjs"
      - "public/assets/*.glb"
      - "assets/blender/character_models.py"
      - "assets/blender/character_animation_bake.py"
      - "scripts/install-character-assets.mjs"
      - "assets/blender/character_weapons.py"
      - "assets/blender/final_valley_scene.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse every browser module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find public/js -type f -name '*.js' -print0)
      - name: Validate Blender and installer scripts
        run: |
          node --check scripts/install-character-assets.mjs
          python3 -m py_compile assets/blender/character_animation_bake.py
      - name: Verify launch roster, DLC reserve, and cache versions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const main = readFileSync('public/js/main.js', 'utf8');
          const root = readFileSync('index.html', 'utf8');
          const page = readFileSync('public/index.html', 'utf8');
          const input = readFileSync('public/js/InputManager.js', 'utf8');
          const versions = [...main.matchAll(/from '\.\/[^']+\.js\?v=([^']+)'/g)].map(match => match[1]);
          assert.ok(versions.length > 0, 'No versioned local game modules were found');
          const version = versions[0];
          assert.ok(versions.every(candidate => candidate === version), 'Game modules use inconsistent cache versions: ' + [...new Set(versions)].join(', '));

          const launchMatch = main.match(/const roster=(\[\[[\s\S]*?\]\]);const dlcRoster/);
          const allMatch = main.match(/const allRoster=(\[\[[\s\S]*?\]\]);const roster/);
          assert.ok(launchMatch, 'Launch roster array was not found');
          assert.ok(allMatch, 'Complete character archive was not found');
          const launch = JSON.parse(launchMatch[1]);
          const all = JSON.parse(allMatch[1]);
          const launchNames = launch.map(([name]) => name);
          assert.equal(launch.length, 32, 'Expected 32 launch fighters');
          assert.equal(new Set(launchNames).size, 32, 'Launch fighter names must be unique');
          assert.ok(launchNames.includes('Spider-Man'), 'Spider-Man must be in launch roster');
          assert.equal(all.length - launch.length, 25, 'DLC reserve should retain 25 characters');

          for (const required of [
            'RoomEnvironment', 'composer.render()', 'Tenkaichi Budokai-inspired Papaya Island',
            'Added monumental skyline', 'enchantedSkyCanvas', 'Airborne Helicarrier underside',
            'window.beginWebSwing=(fighter)=>', 'window.updateWebSwing=(fighter,dt,inputs={})',
            'flightCapable=new Set'
          ]) assert.ok(main.includes(required), 'Missing game feature: ' + required);

          for (const [name, html, expectedPrefix] of [
            ['root', root, './js/main.js?v='],
            ['public', page, './js/main.js?v=']
          ]) {
            const script = html.match(/<script type="module" src="([^"]+)/)?.[1];
            assert.ok(script?.startsWith(expectedPrefix), name + ' entry script path is wrong');
            assert.ok(script.includes(version), name + ' entrypoint cache is stale');
            assert.ok(html.includes('value="Spider-Man"'), name + ' character selector is missing Spider-Man');
          }
          assert.ok(input.includes('smash_input.js?v=' + version), 'InputManager cache is stale');
          const models = readFileSync('public/js/models.js', 'utf8');
          const fighter = readFileSync('public/js/fighter3D.js', 'utf8');
          const human = readFileSync('public/js/human_fighter.js', 'utf8');
          const vfx = readFileSync('public/js/combat_vfx.js', 'utf8');
          const blenderBake = readFileSync('assets/blender/character_animation_bake.py', 'utf8');
          const installer = readFileSync('scripts/install-character-assets.mjs', 'utf8');
          const manifest = JSON.parse(readFileSync('public/models/characters/manifest.json', 'utf8'));
          for (const clip of ["Idle", "Walk", "Run", "Jump", "Land", "Punch", "HeavyAttack", "HitReact", "Block", "Dodge", "Charge", "BeamAttack", "Flight"]) assert.ok(blenderBake.includes('"' + clip + '"'), 'Blender animation clip missing: ' + clip);
          assert.ok(installer.includes("enabled: true") && installer.includes("goku-animated.glb"), 'Character asset installer is missing safe manifest activation');
          assert.ok(vfx.includes('function impact') && vfx.includes('function dash') && vfx.includes('function landing'), 'Combat VFX primitives are missing');
          assert.ok(main.includes('combatVFX.update(elapsed)') && main.includes('combatVFX.launch(start,color,moveType)'), 'Combat VFX are not integrated into the game loop');
          assert.equal(manifest.characters.goku.url, '/models/characters/goku/Goku.fbx', 'Goku asset is not registered');
          assert.equal(manifest.characters.iron_man_tony_stark.url, '/models/characters/iron-man-mark-v-rig/Iron%20Man%20Mark%20V%20Rig%20Materials.gltf', 'Iron Man asset is not registered');
          assert.ok(human.includes("n.includes('left')") && human.includes("n.includes('right')"), 'Mixamo-style rig-side detection is missing');
          assert.ok(fighter.includes('camera-relative steering') && main.includes('window.smashCamera=smashCamera'), 'Camera-relative free-roam controls are missing');
          assert.ok(models.includes('upgradeCharacterWithBlenderModel'), 'Blender character loader is missing');
          assert.ok(models.includes('character_models.glb'), 'Character GLB path is missing');
          assert.ok(models.includes('character_weapons.glb'), 'Weapon GLB path is missing');
          assert.ok(main.includes('window.performSignatureMove'), 'Character signature move system is missing');
          assert.ok(main.includes('window.updateSignatureMoves'), 'Signature movement updates are missing');
          assert.ok(fighter.includes('ODM-style cross cuts'), 'Individual combo choreography is missing');
          for (const feature of ["const SPECIAL_MOVES", "label:'KAMEHAMEHA'", "label:'STORMBREAKER LIGHTNING'", "label:'WEB ZIP STRIKE'"]) assert.ok(main.includes(feature), 'Missing signature move: ' + feature);
          console.log('Validated ' + launch.length + ' launch fighters, ' + (all.length-launch.length) + ' DLC fighters, browser modules, and cinematic-map features.');
          NODE
      - name: Install Playwright and Chromium for runtime testing
        run: |
          npm install --no-save playwright three@0.152.2
          npx playwright install --with-deps chromium
      - name: Smoke-test actual game render and Blender GLB loading
        timeout-minutes: 6
        run: node scripts/browser-smoke.mjs
