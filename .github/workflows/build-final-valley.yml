name: Export Final Valley Blender assets

concurrency:
  group: browser-smash-blender-export
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "assets/blender/final_valley_scene.py"
      - "assets/blender/character_weapons.py"
      - "assets/blender/character_models.py"
      - ".github/workflows/build-final-valley.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-final-valley:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out game
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version | head -n 2
          blender --background --python-expr "import numpy; print('Blender exporter NumPy:', numpy.__version__)"

      - name: Generate editable Blender project and game GLB
        run: |
          mkdir -p public/assets
          blender --background --factory-startup --python assets/blender/final_valley_scene.py
          blender --background --factory-startup --python assets/blender/character_weapons.py
          blender --background --factory-startup --python assets/blender/character_models.py

      - name: Validate Blender file and GLB structure
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          blend = pathlib.Path("assets/blender/final_valley.blend")
          glb = pathlib.Path("public/assets/final_valley.glb")
          weapons_blend = pathlib.Path("assets/blender/character_weapons.blend")
          weapons_glb = pathlib.Path("public/assets/character_weapons.glb")
          characters_blend = pathlib.Path("assets/blender/character_models.blend")
          characters_glb = pathlib.Path("public/assets/character_models.glb")
          assert blend.is_file() and blend.stat().st_size > 100_000, "Missing/empty .blend export"
          assert blend.read_bytes()[:7] == b"BLENDER", "Output is not a Blender project"
          data = glb.read_bytes()
          assert len(data) > 100_000, "Missing/empty GLB export"
          magic, version, declared_length = struct.unpack_from("<4sII", data, 0)
          assert magic == b"glTF" and version == 2, "Invalid GLB header"
          assert declared_length == len(data), "GLB length header does not match file size"
          json_len, json_type = struct.unpack_from("<II", data, 12)
          assert json_type == 0x4E4F534A, "GLB has no JSON chunk"
          document = json.loads(data[20:20+json_len].decode("utf-8").rstrip(" \t\r\n\0"))
          assert document.get("meshes"), "GLB has no meshes"
          assert document.get("materials"), "GLB has no materials"
          print(f"Blender: {blend.stat().st_size/1024/1024:.1f} MiB")
          print(f"Game GLB: {glb.stat().st_size/1024/1024:.1f} MiB; {len(document['meshes'])} meshes; {len(document['materials'])} materials")
          assert weapons_blend.is_file() and weapons_blend.stat().st_size > 100_000, "Missing/empty weapon .blend export"
          assert weapons_blend.read_bytes()[:7] == b"BLENDER", "Weapon output is not a Blender project"
          wdata = weapons_glb.read_bytes()
          assert len(wdata) > 50_000, "Missing/empty weapon GLB export"
          wmagic, wversion, wlength = struct.unpack_from("<4sII", wdata, 0)
          assert wmagic == b"glTF" and wversion == 2 and wlength == len(wdata), "Invalid weapon GLB header"
          wjson_len, wjson_type = struct.unpack_from("<II", wdata, 12)
          assert wjson_type == 0x4E4F534A, "Weapon GLB has no JSON chunk"
          wdoc = json.loads(wdata[20:20+wjson_len].decode("utf-8").rstrip(" \\t\\r\\n\\0"))
          assert len(wdoc.get("meshes", [])) >= 100, "Weapon GLB missing detailed weapon geometry"
          assert wdoc.get("materials"), "Weapon GLB has no materials"
          weapon_nodes = {node.get("name", "") for node in wdoc.get("nodes", [])}
          for required in ("weapon_the_rock_right", "weapon_lord_voldemort_right",
                       "weapon_thor_right", "weapon_aang_right",
                       "weapon_spider_man_right", "weapon_spider_man_left",
                           "weapon_naruto_uzumaki_right", "weapon_madara_uchiha_right",
                           "weapon_wolverine_logan_left", "weapon_link_left"):
              assert required in weapon_nodes, f"Missing weapon prefab node: {required}"
          print(f"Weapon prefabs found: {sum(1 for name in weapon_nodes if name.startswith('weapon_'))}")
          print(f"Weapon Blender library: {weapons_blend.stat().st_size/1024/1024:.1f} MiB")
          print(f"Weapon GLB: {weapons_glb.stat().st_size/1024/1024:.1f} MiB; {len(wdoc['meshes'])} meshes; {len(wdoc['materials'])} materials")
          assert characters_blend.is_file() and characters_blend.stat().st_size > 100_000, "Missing/empty character .blend export"
          assert characters_blend.read_bytes()[:7] == b"BLENDER", "Character output is not a Blender project"
          cdata = characters_glb.read_bytes()
          assert len(cdata) > 100_000, "Missing/empty character GLB"
          cmagic, cversion, clength = struct.unpack_from("<4sII", cdata, 0)
          assert cmagic == b"glTF" and cversion == 2 and clength == len(cdata), "Invalid character GLB header"
          cjson_len, cjson_type = struct.unpack_from("<II", cdata, 12)
          assert cjson_type == 0x4E4F534A, "Character GLB has no JSON chunk"
          cdoc = json.loads(cdata[20:20+cjson_len].decode("utf-8").rstrip(" \\t\\r\\n\\0"))
          assert len(cdoc.get("meshes", [])) >= 500, "Character GLB missing detailed character geometry"
          assert len(cdoc.get("materials", [])) >= 20, "Character GLB missing individualized materials"
          char_nodes = {node.get("name", "") for node in cdoc.get("nodes", [])}
          assert len([name for name in char_nodes if name.startswith("character_")]) >= 57, "DLC character prefabs missing from Blender archive"
          for key in ("superman", "iron_man_tony_stark", "thor", "aang", "madara_uchiha", "spider_man", "the_rock", "wolverine_logan", "sephiroth", "shrek", "lara_croft", "indiana_jones"):
              assert "character_" + key in char_nodes, f"Missing character model prefab: {key}"
              for joint in ("torso", "pelvis", "head", "leftArm", "rightArm", "leftFore", "rightFore", "leftLeg", "rightLeg", "leftShin", "rightShin"):
                  assert "joint_" + key + "_" + joint in char_nodes, f"Missing articulated joint {joint} on {key}"
          print(f"Character Blender library: {characters_blend.stat().st_size/1024/1024:.1f} MiB")
          print(f"Character GLB: {characters_glb.stat().st_size/1024/1024:.1f} MiB; {len(cdoc['meshes'])} meshes; {len(cdoc['materials'])} materials")
          print(f"Character prefabs found: {sum(1 for name in char_nodes if name.startswith('character_'))}")
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/browser-smash-exports
          cp assets/blender/final_valley.blend /tmp/browser-smash-exports/final_valley.blend
          cp public/assets/final_valley.glb /tmp/browser-smash-exports/final_valley.glb
          cp assets/blender/character_weapons.blend /tmp/browser-smash-exports/character_weapons.blend
          cp public/assets/character_weapons.glb /tmp/browser-smash-exports/character_weapons.glb
          cp assets/blender/character_models.blend /tmp/browser-smash-exports/character_models.blend
          cp public/assets/character_models.glb /tmp/browser-smash-exports/character_models.glb
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/browser-smash-exports/final_valley.blend assets/blender/final_valley.blend
            cp /tmp/browser-smash-exports/final_valley.glb public/assets/final_valley.glb
            cp /tmp/browser-smash-exports/character_weapons.blend assets/blender/character_weapons.blend
            cp /tmp/browser-smash-exports/character_weapons.glb public/assets/character_weapons.glb
            cp /tmp/browser-smash-exports/character_models.blend assets/blender/character_models.blend
            cp /tmp/browser-smash-exports/character_models.glb public/assets/character_models.glb
            git add assets/blender/final_valley.blend public/assets/final_valley.glb assets/blender/character_weapons.blend public/assets/character_weapons.glb assets/blender/character_models.blend public/assets/character_models.glb
            if git diff --cached --quiet; then
              echo "Generated assets are already up to date."
              exit 0
            fi
            git commit -m "Export Final Valley and character weapon Blender libraries"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another commit; retrying from the latest main (attempt $attempt)."
            sleep 2
          done
          echo "Unable to push generated Blender assets after 5 attempts."
          exit 1
