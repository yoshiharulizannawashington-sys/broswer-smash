<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Environment asset inspection</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1018}
  canvas{display:block;width:100%;height:100%}
  #label{position:fixed;left:18px;bottom:16px;color:#cfe6ff;font:12px/1.5 ui-monospace,monospace;background:#06101dcc;border:1px solid #2b4a66;padding:8px 11px;white-space:pre}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="label">loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const model = params.get('model');
const hide = new Set((params.get('hide') || '').split(',').filter(Boolean));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1018);
scene.fog = new THREE.FogExp2(0x0b1018, 0.0007);
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.05, 1e7);
const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#gl'), antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x293327, 1.7));
const sun = new THREE.DirectionalLight(0xfff1d0, 2.6);
sun.position.set(-0.5, 1, 0.7).multiplyScalar(300);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8db8ff, 0.75);
fill.position.set(0.8, 0.5, -0.8).multiplyScalar(300);
scene.add(fill);

const loader = new GLTFLoader();
const label = document.querySelector('#label');
window.__environmentViewer = { ready: false, error: null };
loader.load(model.startsWith('/') ? model : '/' + model, gltf => {
  const root = gltf.scene;
  root.traverse(node => {
    if (hide.has(node.name)) node.visible = false;
    if (node.isMesh && node.material) {
      for (const material of [].concat(node.material)) {
        material.side = THREE.FrontSide;
        material.needsUpdate = true;
      }
    }
  });
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z);
  camera.near = Math.max(0.02, span / 5000);
  camera.far = span * 20;
  camera.position.copy(center).add(new THREE.Vector3(span * 0.85, span * 0.52, span * 0.95));
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  scene.fog.density = 0.00025 / Math.max(span, 1);
  const grid = new THREE.GridHelper(span * 1.8, 24, 0x2a4661, 0x172a3c);
  grid.position.set(center.x, box.min.y - span * 0.002, center.z);
  grid.material.opacity = 0.55;
  grid.material.transparent = true;
  scene.add(grid);
  let meshes = 0, triangles = 0;
  root.traverse(node => {
    if (!node.isMesh) return;
    meshes++;
    const count = node.geometry?.index?.count ?? node.geometry?.attributes?.position?.count ?? 0;
    triangles += Math.floor(count / 3);
  });
  label.textContent = `${model}\n${meshes} meshes · ${triangles.toLocaleString()} tris\n${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} units`;
  window.__environmentViewer = {
    ready: true, error: null, meshes, triangles,
    bounds: { min: box.min.toArray(), max: box.max.toArray(), size: size.toArray() },
    hidden: [...hide]
  };
}, undefined, error => {
  window.__environmentViewer = { ready: false, error: String(error?.message || error), stack: String(error?.stack || '') };
  label.textContent = 'ERROR ' + window.__environmentViewer.error;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
